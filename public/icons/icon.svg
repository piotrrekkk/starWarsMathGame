<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#182346" />
      <stop offset="60%" stop-color="#0a0e1c" />
      <stop offset="100%" stop-color="#05070f" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#spaceBg)" stroke="#ffea29" stroke-width="8" filter="url(#goldGlow)" />

  <!-- Crossed Lightsabers -->
  <!-- Blue Saber -->
  <line x1="120" y1="120" x2="392" y2="392" stroke="#00d0ff" stroke-width="16" stroke-linecap="round" filter="url(#cyanGlow)" />
  <line x1="120" y1="120" x2="392" y2="392" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Green Saber -->
  <line x1="392" y1="120" x2="120" y2="392" stroke="#25f252" stroke-width="16" stroke-linecap="round" filter="url(#cyanGlow)" />
  <line x1="392" y1="120" x2="120" y2="392" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Kyber Crystal at Center -->
  <polygon points="256,180 296,256 256,332 216,256" fill="#ffea29" stroke="#ffffff" stroke-width="4" filter="url(#goldGlow)" />

  <!-- Math Symbols -->
  <text x="256" y="115" font-family="'Orbitron', sans-serif" font-size="44" font-weight="900" fill="#00d0ff" text-anchor="middle">+</text>
  <text x="256" y="425" font-family="'Orbitron', sans-serif" font-size="44" font-weight="900" fill="#25f252" text-anchor="middle">&times;</text>
  <text x="100" y="270" font-family="'Orbitron', sans-serif" font-size="44" font-weight="900" fill="#ff2a4b" text-anchor="middle">-</text>
  <text x="412" y="270" font-family="'Orbitron', sans-serif" font-size="44" font-weight="900" fill="#ffea29" text-anchor="middle">:</text>
</svg>
